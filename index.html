<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Our Little Story 💗</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
<style>

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{

    font-family:
        "Segoe UI",
        "Noto Sans Thai",
        sans-serif;

    background:
        linear-gradient(
            135deg,
            #fff6fb 0%,
            #f4f7ff 45%,
            #f7f0ff 100%
        );

    color:#665d72;

    overflow:hidden;
}


/* =========================================================
   BACKGROUND
========================================================= */

.background{

    position:fixed;

    inset:0;

    overflow:hidden;

    pointer-events:none;
}


/* =========================================================
   BLOBS
========================================================= */

.blob{

    position:absolute;

    border-radius:50%;

    filter:blur(10px);

    opacity:.55;
}

.blob.one{

    width:330px;
    height:330px;

    background:#ffd5e7;

    top:-100px;
    left:-100px;
}

.blob.two{

    width:280px;
    height:280px;

    background:#cdeeff;

    right:-80px;
    top:15%;
}

.blob.three{

    width:350px;
    height:350px;

    background:#dfd0ff;

    left:25%;
    bottom:-180px;
}


/* =========================================================
   STARS
========================================================= */

.star{

    position:absolute;

    color:white;

    font-size:18px;

    opacity:.8;

    animation:
        twinkle 3s ease-in-out infinite;
}

.star:nth-child(1){
    top:12%;
    left:14%;
    animation-delay:.2s;
}

.star:nth-child(2){
    top:20%;
    right:17%;
    animation-delay:1s;
}

.star:nth-child(3){
    top:48%;
    left:8%;
    animation-delay:1.7s;
}

.star:nth-child(4){
    top:67%;
    right:10%;
    animation-delay:.5s;
}

.star:nth-child(5){
    top:80%;
    left:18%;
    animation-delay:2s;
}

.star:nth-child(6){
    top:35%;
    right:34%;
    animation-delay:1.3s;
}

.star:nth-child(7){
    top:10%;
    right:42%;
    animation-delay:2.3s;
}

@keyframes twinkle{

    0%,
    100%{

        transform:
            scale(.7);

        opacity:.3;
    }

    50%{

        transform:
            scale(1.3);

        opacity:1;
    }

}


/* =========================================================
   HEARTS
========================================================= */

.heart{

    position:absolute;

    color:#f4a8c8;

    opacity:.65;

    animation:
        heartFloat 6s ease-in-out infinite;
}

.heart.h1{

    top:28%;
    left:18%;

    font-size:20px;
}

.heart.h2{

    top:58%;
    right:18%;

    font-size:25px;

    animation-delay:1.2s;
}

.heart.h3{

    bottom:23%;
    left:28%;

    font-size:17px;

    animation-delay:2s;
}

.heart.h4{

    top:25%;
    right:28%;

    font-size:16px;

    animation-delay:.7s;
}

@keyframes heartFloat{

    0%,
    100%{

        transform:
            translateY(0);
    }

    50%{

        transform:
            translateY(-15px);
    }

}


/* =========================================================
   MAIN
========================================================= */

.main{

    position:relative;

    z-index:5;

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:30px;
}


/* =========================================================
   CARD
========================================================= */

.card{

    width:min(520px,100%);

    padding:
        42px 35px 38px;

    text-align:center;

    background:
        rgba(255,255,255,.72);

    border:
        1px solid
        rgba(255,255,255,.9);

    border-radius:38px;

    box-shadow:
        0 25px 70px
        rgba(150,125,170,.15),

        inset 0 1px 0
        rgba(255,255,255,.9);

    backdrop-filter:
        blur(18px);

    animation:
        cardAppear 1s ease forwards;
}

@keyframes cardAppear{

    from{

        opacity:0;

        transform:
            translateY(30px)
            scale(.96);
    }

    to{

        opacity:1;

        transform:
            translateY(0)
            scale(1);
    }

}


/* =========================================================
   BEAR
========================================================= */

.bear-wrap{

    width:120px;
    height:120px;

    margin:
        0 auto 20px;

    display:flex;

    justify-content:center;

    align-items:center;

    position:relative;

    background:
        linear-gradient(
            145deg,
            #fff4f8,
            #edf7ff
        );

    border-radius:50%;

    box-shadow:
        0 15px 35px
        rgba(190,160,190,.18);

    animation:
        bearFloat 3s ease-in-out infinite;
}

.bear{

    font-size:70px;

    line-height:1;
}

.bear-heart{

    position:absolute;

    right:4px;
    bottom:4px;

    font-size:30px;

    animation:
        heartbeat 1.5s ease-in-out infinite;
}

@keyframes bearFloat{

    0%,
    100%{

        transform:
            translateY(0);
    }

    50%{

        transform:
            translateY(-8px);
    }

}

@keyframes heartbeat{

    0%,
    100%{

        transform:
            scale(1);
    }

    50%{

        transform:
            scale(1.2);
    }

}


/* =========================================================
   TEXT
========================================================= */

.small-title{

    font-size:13px;

    letter-spacing:4px;

    color:#b58dc8;

    margin-bottom:10px;

    font-weight:600;
}

h1{
    font-family:"Cormorant Garamond", serif;

    font-size:
        clamp(42px,8vw,68px);

    font-weight:500;

    letter-spacing:1px;

    color:#796783;

    line-height:1.1;

    margin-bottom:10px;
}

h1 span{
    color:#e89fbe;
}

.subtitle{

    font-size:15px;

    color:#8b8192;

    line-height:1.8;

    margin:
        0 auto 25px;

    max-width:390px;
}


/* =========================================================
   BUTTON
========================================================= */

.start-btn{

    border:none;

    padding:
        15px 30px;

    border-radius:50px;

    font-family:inherit;

    font-size:16px;

    font-weight:600;

    color:white;

    cursor:pointer;

    background:
        linear-gradient(
            135deg,
            #f2abc9,
            #bca9e9,
            #9ed6ed
        );

    box-shadow:
        0 12px 25px
        rgba(190,155,205,.28);

    transition:
        transform .25s ease,
        box-shadow .25s ease;

    position:relative;

    overflow:hidden;
}

.start-btn::before{

    content:"";

    position:absolute;

    top:0;
    left:-100%;

    width:70%;
    height:100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.45),
            transparent
        );

    transform:
        skewX(-20deg);

    transition:.5s;
}

.start-btn:hover::before{

    left:130%;
}

.start-btn:hover{

    transform:
        translateY(-3px)
        scale(1.02);

    box-shadow:
        0 16px 32px
        rgba(180,145,205,.35);
}

.start-btn:active{

    transform:
        translateY(0)
        scale(.98);
}


/* =========================================================
   BOTTOM TEXT
========================================================= */

.bottom-text{

    margin-top:22px;

    font-size:12px;

    color:#aaa0ad;
}


/* =========================================================
   MUSIC BUTTON
========================================================= */

.music-button{

    position:fixed;

    top:20px;
    right:20px;

    width:50px;
    height:50px;

    border:none;

    border-radius:50%;

    background:
        rgba(255,255,255,.82);

    backdrop-filter:
        blur(15px);

    -webkit-backdrop-filter:
        blur(15px);

    box-shadow:
        0 10px 30px
        rgba(120,90,150,.18);

    font-size:21px;

    cursor:pointer;

    z-index:99999;

    transition:
        .3s ease;
}

.music-button:hover{

    transform:
        scale(1.1);

    box-shadow:
        0 12px 35px
        rgba(180,120,190,.3);
}

.music-button.playing{

    animation:
        musicPulse 2s ease-in-out infinite;
}

@keyframes musicPulse{

    0%,
    100%{

        transform:
            scale(1);
    }

    50%{

        transform:
            scale(1.08);
    }

}


/* =========================================================
   MUSIC LABEL
========================================================= */

.music-label{

    position:fixed;

    top:78px;
    right:20px;

    padding:
        7px 13px;

    border-radius:20px;

    background:
        rgba(255,255,255,.8);

    backdrop-filter:
        blur(10px);

    color:#9a83a5;

    font-size:11px;

    opacity:0;

    transform:
        translateY(-5px);

    pointer-events:none;

    transition:
        .3s ease;

    z-index:99998;
}

.music-label.show{

    opacity:1;

    transform:
        translateY(0);
}


/* =========================================================
   CLICK HEART
========================================================= */

.click-heart{

    position:fixed;

    pointer-events:none;

    font-size:20px;

    z-index:999;

    animation:
        clickHeart 1s ease forwards;
}

@keyframes clickHeart{

    0%{

        opacity:1;

        transform:
            translate(-50%,-50%)
            scale(.5);
    }

    100%{

        opacity:0;

        transform:
            translate(
                calc(-50% + var(--x)),
                calc(-50% + var(--y))
            )
            scale(1.5);
    }

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

    .main{

        padding:18px;
    }

    .card{

        padding:
            34px 22px 30px;

        border-radius:30px;
    }

    .bear-wrap{

        width:105px;
        height:105px;
    }

    .bear{

        font-size:62px;
    }

    .subtitle{

        font-size:14px;
    }

    .start-btn{

        width:100%;
    }

    .music-button{

        width:45px;
        height:45px;

        top:14px;
        right:14px;
    }

    .music-label{

        top:67px;
        right:14px;
    }

}

</style>

</head>


<body>


<!-- =======================================================
     BACKGROUND
======================================================= -->

<div class="background">

    <div class="blob one"></div>

    <div class="blob two"></div>

    <div class="blob three"></div>


    <div class="star">✦</div>
    <div class="star">✧</div>
    <div class="star">✦</div>
    <div class="star">✧</div>
    <div class="star">✦</div>
    <div class="star">✧</div>
    <div class="star">✦</div>


    <div class="heart h1">♡</div>
    <div class="heart h2">♥</div>
    <div class="heart h3">♡</div>
    <div class="heart h4">♥</div>

</div>


<!-- =======================================================
     MUSIC
======================================================= -->

<audio
    id="backgroundMusic"
    src="music/music.mp3"
    loop
    preload="auto"
></audio>


<button
    class="music-button"
    id="musicButton"
    type="button"
>
    🔇
</button>


<div
    class="music-label"
    id="musicLabel"
>
    เพลงกำลังเล่น 🎵
</div>


<!-- =======================================================
     MAIN
======================================================= -->

<main class="main">

    <section class="card">

        <div class="bear-wrap">

            <div class="bear">
                🧸
            </div>

            <div class="bear-heart">
                💗
            </div>

        </div>


        <div class="small-title">
            10/9/2569
        </div>


        <h1>
            Happy <span>Anniversary</span>
        </h1>


        <p class="subtitle">

            สุขสันต์วันครบรอบน้าาาา
            

        </p>


        <button
            class="start-btn"
            onclick="startSurprise(event)"
        >
            พร้อมแล้วกดเลย 
        </button>


        <div class="bottom-text">
            
        </div>

    </section>

</main>


<script>

/* =========================================================
   MUSIC SYSTEM
========================================================= */

const music =
    document.getElementById(
        "backgroundMusic"
    );

const musicButton =
    document.getElementById(
        "musicButton"
    );

const musicLabel =
    document.getElementById(
        "musicLabel"
    );


let musicOn =
    localStorage.getItem(
        "musicOn"
    ) === "true";


/* =========================================================
   INITIAL VOLUME
========================================================= */

music.volume = 0.35;


/* =========================================================
   UPDATE BUTTON
========================================================= */

function updateMusicButton(){

    if(!music.paused){

        musicButton.innerHTML = "🎵";

        musicButton.classList.add(
            "playing"
        );

    }else{

        musicButton.innerHTML = "🔇";

        musicButton.classList.remove(
            "playing"
        );

    }

}


/* =========================================================
   SHOW MUSIC LABEL
========================================================= */

function showMusicLabel(text){

    musicLabel.innerHTML =
        text;

    musicLabel.classList.add(
        "show"
    );

    setTimeout(() => {

        musicLabel.classList.remove(
            "show"
        );

    }, 1800);

}


/* =========================================================
   PLAY MUSIC
========================================================= */

function playMusic(){

    music.play()
        .then(() => {

            musicOn = true;

            localStorage.setItem(
                "musicOn",
                "true"
            );

            updateMusicButton();

            showMusicLabel(
                "เพลงกำลังเล่น 🎵"
            );

        })
        .catch((error) => {

            console.log(
                "Music error:",
                error
            );

            showMusicLabel(
                "แตะปุ่ม 🎵 เพื่อเปิดเพลง"
            );

            updateMusicButton();

        });

}


/* =========================================================
   PAUSE MUSIC
========================================================= */

function pauseMusic(){

    music.pause();

    musicOn = false;

    localStorage.setItem(
        "musicOn",
        "false"
    );

    updateMusicButton();

    showMusicLabel(
        "ปิดเพลงแล้ว 🔇"
    );

}


/* =========================================================
   MUSIC BUTTON
========================================================= */

musicButton.addEventListener(
    "click",
    function(event){

        event.stopPropagation();

        if(music.paused){

            playMusic();

        }else{

            pauseMusic();

        }

    }
);


/* =========================================================
   START SURPRISE
========================================================= */

function startSurprise(event){

    /* -------------------------
       START MUSIC
    ------------------------- */

    playMusic();


    /* -------------------------
       HEART EFFECT
    ------------------------- */

    const x =
        event.clientX ||
        window.innerWidth / 2;

    const y =
        event.clientY ||
        window.innerHeight / 2;


    createHeart(x,y);


    for(let i = 0; i < 12; i++){

        setTimeout(() => {

            createHeart(
                x,
                y
            );

        }, i * 70);

    }


    /* -------------------------
       BUTTON
    ------------------------- */

    const button =
        document.querySelector(
            ".start-btn"
        );

    button.innerHTML =
        "กำลังเปิด";

    button.style.pointerEvents =
        "none";


    /* -------------------------
       NEXT PAGE
    ------------------------- */

    setTimeout(() => {

        window.location.href =
            "password.html";

    }, 900);

}


/* =========================================================
   CREATE HEART
========================================================= */

function createHeart(x,y){

    const heart =
        document.createElement(
            "div"
        );

    heart.className =
        "click-heart";

    heart.innerHTML =
        Math.random() > .5
        ? "💗"
        : "♡";


    heart.style.left =
        x + "px";

    heart.style.top =
        y + "px";


    heart.style.setProperty(
        "--x",
        (
            Math.random() * 160 - 80
        ) + "px"
    );


    heart.style.setProperty(
        "--y",
        (
            Math.random() * -180 - 30
        ) + "px"
    );


    document.body.appendChild(
        heart
    );


    setTimeout(() => {

        heart.remove();

    },1100);

}


/* =========================================================
   ENTER KEY
========================================================= */

document.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            const button =
                document.querySelector(
                    ".start-btn"
                );

            button.click();

        }

    }
);


/* =========================================================
   INITIAL STATE
========================================================= */

updateMusicButton();

</script>

<script src="music.js"></script>
</body>

</html>
