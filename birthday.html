<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>วันของเรา 💗</title>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{

    font-family:
        "Segoe UI",
        "Noto Sans Thai",
        sans-serif;

    color:#756a7d;

    overflow:hidden;

    background:
        linear-gradient(
            135deg,
            #fff5fa 0%,
            #f2f8ff 50%,
            #f5efff 100%
        );
}


/* =========================================================
   BACKGROUND
========================================================= */

.background{

    position:fixed;
    inset:0;

    overflow:hidden;

    pointer-events:none;
}


/* =========================================================
   PASTEL BLOBS
========================================================= */

.blob{

    position:absolute;

    border-radius:50%;

    filter:blur(22px);

    opacity:.5;
}

.blob.one{

    width:400px;
    height:400px;

    left:-170px;
    top:-170px;

    background:#ffd4e7;
}

.blob.two{

    width:360px;
    height:360px;

    right:-140px;
    top:15%;

    background:#ccecff;
}

.blob.three{

    width:450px;
    height:450px;

    left:28%;
    bottom:-300px;

    background:#dfd1ff;
}


/* =========================================================
   CLOUDS
========================================================= */

.cloud{

    position:absolute;

    font-size:70px;

    opacity:.45;

    filter:
        blur(.2px);

    animation:
        cloudMove 12s ease-in-out infinite;
}

.cloud.one{

    top:12%;
    left:-20px;
}

.cloud.two{

    top:22%;
    right:-15px;

    font-size:55px;

    animation-delay:3s;
}

.cloud.three{

    bottom:10%;
    left:10%;

    font-size:50px;

    animation-delay:1.5s;
}

@keyframes cloudMove{

    0%,
    100%{
        transform:translateX(0);
    }

    50%{
        transform:translateX(18px);
    }
}


/* =========================================================
   STARS
========================================================= */

.star{

    position:absolute;

    color:white;

    font-size:20px;

    animation:
        twinkle 3s ease-in-out infinite;
}

.star.s1{
    top:9%;
    left:15%;
}

.star.s2{
    top:17%;
    right:18%;
    animation-delay:.8s;
}

.star.s3{
    top:45%;
    left:7%;
    animation-delay:1.6s;
}

.star.s4{
    top:72%;
    right:9%;
    animation-delay:.4s;
}

.star.s5{
    bottom:12%;
    left:20%;
    animation-delay:2s;
}

.star.s6{
    top:31%;
    right:32%;
    animation-delay:1.2s;
}

.star.s7{
    bottom:25%;
    right:28%;
    animation-delay:2.4s;
}

@keyframes twinkle{

    0%,
    100%{
        opacity:.2;
        transform:scale(.7);
    }

    50%{
        opacity:1;
        transform:scale(1.35);
    }
}


/* =========================================================
   FLOWERS
========================================================= */

.flower{

    position:absolute;

    font-size:40px;

    animation:
        flowerFloat 5s ease-in-out infinite;
}

.flower.f1{

    top:6%;
    left:6%;

    transform:rotate(-12deg);
}

.flower.f2{

    top:7%;
    right:6%;

    transform:rotate(12deg);

    animation-delay:1s;
}

.flower.f3{

    bottom:7%;
    left:7%;

    animation-delay:1.7s;
}

.flower.f4{

    bottom:8%;
    right:7%;

    animation-delay:2.2s;
}

@keyframes flowerFloat{

    0%,
    100%{
        transform:
            translateY(0)
            rotate(-7deg);
    }

    50%{
        transform:
            translateY(-10px)
            rotate(6deg);
    }
}


/* =========================================================
   FLOATING HEARTS
========================================================= */

.heart{

    position:absolute;

    color:#eca8c7;

    opacity:.65;

    animation:
        heartFloat 5s ease-in-out infinite;
}

.heart.h1{

    top:25%;
    left:18%;

    font-size:21px;
}

.heart.h2{

    top:58%;
    right:17%;

    font-size:28px;

    animation-delay:1s;
}

.heart.h3{

    bottom:20%;
    left:27%;

    font-size:17px;

    animation-delay:2s;
}

.heart.h4{

    top:24%;
    right:30%;

    font-size:16px;

    animation-delay:.5s;
}

@keyframes heartFloat{

    0%,
    100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-15px);
    }
}


/* =========================================================
   MAIN
========================================================= */

.main{

    position:relative;

    z-index:5;

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:20px;
}


/* =========================================================
   CARD
========================================================= */

.card{

    width:min(570px,100%);

    padding:
        30px
        25px
        28px;

    text-align:center;

    background:
        rgba(255,255,255,.76);

    border:
        1px solid
        rgba(255,255,255,.9);

    border-radius:40px;

    box-shadow:

        0 30px 80px
        rgba(150,125,170,.17),

        inset 0 1px 0
        rgba(255,255,255,.9);

    backdrop-filter:blur(20px);

    animation:
        cardIn .9s ease;
}

@keyframes cardIn{

    from{

        opacity:0;

        transform:
            translateY(30px)
            scale(.95);
    }

    to{

        opacity:1;

        transform:
            translateY(0)
            scale(1);
    }
}


/* =========================================================
   TOP LABEL
========================================================= */

.small-title{

    font-size:12px;

    letter-spacing:4px;

    color:#b08ac1;

    margin-bottom:7px;

    font-weight:600;
}


/* =========================================================
   TITLE
========================================================= */

h1{

    font-size:
        clamp(
            30px,
            7vw,
            44px
        );

    line-height:1.15;

    color:#75697f;

    margin-bottom:6px;
}

h1 span{

    color:#e49fbd;
}


/* =========================================================
   DATE
========================================================= */

.date{

    display:inline-flex;

    align-items:center;

    gap:9px;

    padding:
        8px
        18px;

    margin-top:3px;

    border-radius:30px;

    background:
        linear-gradient(
            90deg,
            #fff0f7,
            #eef8ff
        );

    color:#a17da9;

    font-size:13px;

    box-shadow:
        0 8px 20px
        rgba(180,150,190,.1);
}


/* =========================================================
   LOVE SCENE
========================================================= */

.love-scene{

    width:330px;
    height:240px;

    margin:
        5px auto 5px;

    position:relative;

    display:flex;

    align-items:center;

    justify-content:center;
}


/* =========================================================
   CENTER HEART
========================================================= */

.big-heart{

    position:relative;

    z-index:5;

    width:105px;
    height:105px;

    display:flex;

    justify-content:center;
    align-items:center;

    border-radius:50%;

    background:
        linear-gradient(
            145deg,
            #fff1f7,
            #f0f8ff
        );

    box-shadow:

        0 15px 35px
        rgba(190,150,190,.18);

    animation:
        heartCenter 2.4s
        ease-in-out
        infinite;
}

.big-heart::before{

    content:"🧸";

    font-size:65px;

    filter:
        drop-shadow(
            0 7px 10px
            rgba(210,130,170,.2)
        );
}

@keyframes heartCenter{

    0%,
    100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.08);
    }
}


/* =========================================================
   HEART RINGS
========================================================= */

.heart-ring{

    position:absolute;

    width:155px;
    height:155px;

    border-radius:50%;

    border:
        2px dashed
        rgba(228,165,201,.4);

    animation:
        rotateRing 12s linear infinite;
}

.heart-ring::before{

    content:"✦";

    position:absolute;

    top:-11px;
    left:50%;

    transform:
        translateX(-50%);

    color:#d5b8ec;

    font-size:18px;
}

.heart-ring::after{

    content:"♡";

    position:absolute;

    bottom:-14px;
    right:17%;

    color:#efa9c7;

    font-size:20px;
}

@keyframes rotateRing{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }
}


/* =========================================================
   BEARS
========================================================= */

.bear{

    position:absolute;

    z-index:7;

    font-size:65px;

    filter:
        drop-shadow(
            0 7px 8px
            rgba(150,120,150,.13)
        );

    animation:
        bearFloat 3s ease-in-out infinite;
}

.bear.left{

    left:8px;
    bottom:34px;

    transform:rotate(-7deg);
}

.bear.right{

    right:8px;
    bottom:34px;

    transform:rotate(7deg);

    animation-delay:.6s;
}

@keyframes bearFloat{

    0%,
    100%{
        transform:
            translateY(0)
            rotate(-5deg);
    }

    50%{
        transform:
            translateY(-8px)
            rotate(4deg);
    }
}


/* =========================================================
   FLOWERS AROUND HEART
========================================================= */

.scene-flower{

    position:absolute;

    font-size:32px;

    z-index:4;

    animation:
        sceneFlower 3.5s
        ease-in-out
        infinite;
}

.scene-flower.one{

    left:62px;
    top:45px;

    transform:rotate(-15deg);
}

.scene-flower.two{

    right:60px;
    top:48px;

    transform:rotate(15deg);

    animation-delay:1s;
}

@keyframes sceneFlower{

    0%,
    100%{
        transform:
            translateY(0)
            rotate(-10deg);
    }

    50%{
        transform:
            translateY(-7px)
            rotate(8deg);
    }
}


/* =========================================================
   MESSAGE
========================================================= */

.message{

    max-width:390px;

    margin:
        0 auto 18px;

    color:#958a9a;

    font-size:14px;

    line-height:1.85;
}

.message strong{

    color:#d996b5;

    font-weight:600;
}


/* =========================================================
   BUTTON
========================================================= */

.next-btn{

    border:none;

    padding:
        14px
        28px;

    min-width:230px;

    border-radius:50px;

    color:white;

    font-family:inherit;

    font-size:15px;

    font-weight:600;

    cursor:pointer;

    background:
        linear-gradient(
            135deg,
            #f1abc9,
            #bba8e8,
            #9ed7ee
        );

    box-shadow:
        0 12px 28px
        rgba(180,145,200,.25);

    transition:
        .25s ease;
}

.next-btn:hover{

    transform:
        translateY(-3px)
        scale(1.02);

    box-shadow:
        0 17px 35px
        rgba(180,145,200,.33);
}

.next-btn:active{

    transform:
        scale(.97);
}


/* =========================================================
   BOTTOM
========================================================= */

.bottom{

    margin-top:14px;

    font-size:12px;

    color:#aaa0ad;
}


/* =========================================================
   TRANSITION
========================================================= */

.transition{

    position:fixed;

    inset:0;

    z-index:500;

    display:flex;

    align-items:center;

    justify-content:center;

    background:
        linear-gradient(
            135deg,
            #fff3fa,
            #f1f8ff,
            #f5edff
        );

    opacity:0;

    pointer-events:none;

    transition:
        opacity .6s ease;
}

.transition.show{

    opacity:1;

    pointer-events:auto;
}

.transition-icon{

    font-size:70px;

    animation:
        transitionPulse 1s
        ease-in-out
        infinite;
}

@keyframes transitionPulse{

    0%,
    100%{
        transform:scale(.9);
    }

    50%{
        transform:scale(1.2);
    }
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

    .main{
        padding:15px;
    }

    .card{

        padding:
            28px
            15px
            25px;

        border-radius:32px;
    }

    .love-scene{

        width:290px;
        height:215px;
    }

    .big-heart{

        width:90px;
        height:90px;
    }

    .big-heart::before{
        font-size:55px;
    }

    .heart-ring{

        width:135px;
        height:135px;
    }

    .bear{
        font-size:54px;
    }

    .bear.left{
        left:0;
    }

    .bear.right{
        right:0;
    }

    .scene-flower{
        font-size:27px;
    }

    .scene-flower.one{
        left:48px;
    }

    .scene-flower.two{
        right:48px;
    }

    .message{
        font-size:13px;
    }

    .flower{
        font-size:30px;
    }

}

</style>

</head>


<body>


<!-- =======================================================
     BACKGROUND
======================================================= -->

<div class="background">


    <div class="blob one"></div>

    <div class="blob two"></div>

    <div class="blob three"></div>


    <!-- clouds -->

    <div class="cloud one">
        ☁️
    </div>

    <div class="cloud two">
        ☁️
    </div>

    <div class="cloud three">
        ☁️
    </div>


    <!-- stars -->

    <div class="star s1">✦</div>
    <div class="star s2">✧</div>
    <div class="star s3">✦</div>
    <div class="star s4">✧</div>
    <div class="star s5">✦</div>
    <div class="star s6">✧</div>
    <div class="star s7">✦</div>


    <!-- flowers -->

    


    <!-- hearts -->

    <div class="heart h1">♡</div>
    <div class="heart h2">♥</div>
    <div class="heart h3">♡</div>
    <div class="heart h4">♥</div>

</div>



<!-- =======================================================
     MAIN
======================================================= -->

<main class="main">


    <section class="card">


        <div class="small-title">
            
        </div>


        <h1>
            Happy <span>Anniversary</span>
        </h1>


        <div class="date">

            

        </div>



        <!-- =================================================
             LOVE SCENE
        ================================================= -->

        <div class="love-scene">


            <div class="heart-ring"></div>


            <div class="bear left">
                💗
            </div>
           

            


            <div class="scene-flower one">
                
            </div>


            <div class="scene-flower two">
                
            </div>


            <div class="big-heart"></div>


        </div>



        <!-- =================================================
             MESSAGE
        ================================================= -->

        <p class="message">

            สุขสันต์วันครบรอบนะคะที่รัก อาจจะไม่ค่อยได้เห็นแบบนีน้าา
            <br>
            พอมานั่งคิดดูเวลาผ่านไปเร็วจังเลยแป๊บๆจะโตเป็นสาวแล้ว
           
            <br>

            สุขสันต์วันครบรอบของเรานะคะ
            <strong>พี่ภูมใจ</strong> ที่มีหนูนะคะ 💗

            <br><br>
            ยังมีอีกน้ายังไม่จบบ
        
            <br>
            แต่ก่อนกดสัญญาก่อนว่าจะไม่โกรธธไม่งั้นห้ามกด!!!

            
        </p>



        <!-- BUTTON -->

        <button
            class="next-btn"
            onclick="goNext()"
        >
        
        ไปกันต่อ 

        </button>


        <div class="bottom">

            

        </div>


    </section>

</main>



<!-- =======================================================
     TRANSITION
======================================================= -->

<div
    class="transition"
    id="transition"
>

    <div class="transition-icon">
        🧸
    </div>

</div>



<script>

/* =========================================================
   NEXT PAGE
========================================================= */

function goNext(){

    const transition =
        document.getElementById(
            "transition"
        );


    transition.classList.add(
        "show"
    );


    createHearts();


    setTimeout(() => {

        window.location.href =
            "memory.html";

    },900);

}


/* =========================================================
   HEART PARTICLES
========================================================= */

function createHearts(){

    const icons = [
        "💗",
        "♡",
        "🌷",
        "⭐",
        "✨"
    ];


    for(let i = 0; i < 25; i++){

        setTimeout(() => {

            const item =
                document.createElement(
                    "div"
                );


            item.style.position =
                "fixed";

            item.style.left =
                "50%";

            item.style.top =
                "50%";

            item.style.zIndex =
                "600";

            item.style.pointerEvents =
                "none";

            item.style.fontSize =
                (
                    18 +
                    Math.random() * 15
                ) + "px";


            item.textContent =
                icons[
                    Math.floor(
                        Math.random()
                        * icons.length
                    )
                ];


            const x =
                Math.random() * 500
                - 250;

            const y =
                Math.random() * 450
                - 260;


            item.animate(

                [

                    {
                        opacity:1,

                        transform:
                            "translate(-50%,-50%) scale(.3)"
                    },

                    {

                        opacity:0,

                        transform:
                            `translate(
                                calc(-50% + ${x}px),
                                calc(-50% + ${y}px)
                            )
                            rotate(${Math.random()*360}deg)
                            scale(1.4)`
                    }

                ],

                {

                    duration:
                        900 +
                        Math.random() * 500,

                    easing:
                        "cubic-bezier(.2,.8,.2,1)",

                    fill:"forwards"
                }

            );


            document.body.appendChild(
                item
            );


            setTimeout(() => {

                item.remove();

            },1500);

        }, i * 35);

    }

}

</script>

<script src="music.js"></script>
</body>

</html>
