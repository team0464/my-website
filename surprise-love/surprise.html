<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>ของขวัญ</title>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{

    font-family:
        "Segoe UI",
        "Noto Sans Thai",
        sans-serif;

    overflow:hidden;

    color:#756a7d;

    background:
        linear-gradient(
            135deg,
            #fff5fa,
            #f2f8ff 50%,
            #f6efff
        );
}


/* =========================================================
   BACKGROUND
========================================================= */

.background{

    position:fixed;
    inset:0;

    overflow:hidden;

    pointer-events:none;
}


/* pastel blobs */

.blob{

    position:absolute;

    border-radius:50%;

    filter:blur(20px);

    opacity:.5;
}

.blob.one{

    width:380px;
    height:380px;

    left:-150px;
    top:-150px;

    background:#ffd3e6;
}

.blob.two{

    width:350px;
    height:350px;

    right:-130px;
    top:15%;

    background:#ccecff;
}

.blob.three{

    width:430px;
    height:430px;

    left:30%;
    bottom:-280px;

    background:#dfd0ff;
}


/* =========================================================
   STARS
========================================================= */

.star{

    position:absolute;

    color:white;

    font-size:19px;

    animation:
        twinkle 3s ease-in-out infinite;
}

.star.s1{
    top:9%;
    left:14%;
}

.star.s2{
    top:20%;
    right:16%;
    animation-delay:.8s;
}

.star.s3{
    top:44%;
    left:7%;
    animation-delay:1.5s;
}

.star.s4{
    top:70%;
    right:9%;
    animation-delay:.4s;
}

.star.s5{
    bottom:12%;
    left:20%;
    animation-delay:2s;
}

.star.s6{
    top:30%;
    right:32%;
    animation-delay:1.1s;
}

@keyframes twinkle{

    0%,
    100%{
        opacity:.25;
        transform:scale(.7);
    }

    50%{
        opacity:1;
        transform:scale(1.3);
    }
}


/* =========================================================
   FLOWERS
========================================================= */

.flower{

    position:absolute;

    font-size:38px;

    animation:
        flowerFloat 5s ease-in-out infinite;
}

.flower.f1{

    top:7%;
    left:6%;
}

.flower.f2{

    top:8%;
    right:6%;

    animation-delay:1s;
}

.flower.f3{

    bottom:7%;
    left:7%;

    animation-delay:1.5s;
}

.flower.f4{

    bottom:8%;
    right:7%;

    animation-delay:2s;
}

@keyframes flowerFloat{

    0%,
    100%{
        transform:
            translateY(0)
            rotate(-7deg);
    }

    50%{
        transform:
            translateY(-10px)
            rotate(6deg);
    }
}


/* =========================================================
   FLOATING HEARTS
========================================================= */

.heart{

    position:absolute;

    color:#eda8c7;

    opacity:.6;

    animation:
        heartFloat 5s ease-in-out infinite;
}

.heart.h1{

    top:25%;
    left:18%;

    font-size:20px;
}

.heart.h2{

    top:60%;
    right:17%;

    font-size:25px;

    animation-delay:1s;
}

.heart.h3{

    bottom:20%;
    left:28%;

    font-size:16px;

    animation-delay:2s;
}

.heart.h4{

    top:24%;
    right:29%;

    font-size:17px;

    animation-delay:.5s;
}

@keyframes heartFloat{

    0%,
    100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-15px);
    }
}


/* =========================================================
   MAIN
========================================================= */

.main{

    position:relative;

    z-index:5;

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:20px;
}


/* =========================================================
   CARD
========================================================= */

.card{

    width:min(540px,100%);

    padding:
        35px
        25px
        32px;

    text-align:center;

    background:
        rgba(255,255,255,.76);

    border:
        1px solid
        rgba(255,255,255,.9);

    border-radius:40px;

    box-shadow:

        0 30px 80px
        rgba(150,125,170,.17),

        inset 0 1px 0
        rgba(255,255,255,.9);

    backdrop-filter:blur(20px);

    animation:
        cardIn .9s ease;
}

@keyframes cardIn{

    from{

        opacity:0;

        transform:
            translateY(30px)
            scale(.94);
    }

    to{

        opacity:1;

        transform:
            translateY(0)
            scale(1);
    }
}


/* =========================================================
   TITLE
========================================================= */

.small-title{

    font-size:12px;

    letter-spacing:4px;

    color:#b18bc3;

    margin-bottom:7px;

    font-weight:600;
}


h1{

    font-size:
        clamp(
            28px,
            7vw,
            40px
        );

    color:#766a80;

    line-height:1.2;

    margin-bottom:7px;
}


h1 span{

    color:#e5a0bd;
}


.description{

    max-width:360px;

    margin:
        0 auto 15px;

    color:#988e9e;

    font-size:14px;

    line-height:1.8;
}


/* =========================================================
   GIFT STAGE
========================================================= */

.gift-stage{

    width:300px;
    height:270px;

    margin:0 auto;

    position:relative;

    display:flex;

    justify-content:center;

    align-items:flex-end;
}


/* =========================================================
   GLOW
========================================================= */

.gift-glow{

    position:absolute;

    width:210px;
    height:210px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(245,190,220,.55),
            rgba(210,200,240,.18),
            transparent 70%
        );

    filter:blur(8px);

    animation:
        glowPulse 2.5s ease-in-out infinite;
}

@keyframes glowPulse{

    0%,
    100%{
        transform:scale(.9);
        opacity:.6;
    }

    50%{
        transform:scale(1.1);
        opacity:1;
    }
}


/* =========================================================
   GIFT BOX
========================================================= */

.gift{

    width:190px;
    height:145px;

    position:relative;

    margin-bottom:25px;

    cursor:pointer;

    filter:
        drop-shadow(
            0 18px 20px
            rgba(150,120,160,.18)
        );

    transition:
        transform .3s ease;
}

.gift:hover{

    transform:
        translateY(-7px)
        scale(1.03);
}


/* box body */

.gift-box{

    position:absolute;

    width:190px;
    height:120px;

    left:0;
    bottom:0;

    border-radius:
        8px
        8px
        18px
        18px;

    background:
        linear-gradient(
            135deg,
            #f8b8d2,
            #d8b9ed
        );

    overflow:hidden;
}


/* box highlight */

.gift-box::after{

    content:"";

    position:absolute;

    top:0;
    left:18px;

    width:35px;
    height:100%;

    background:
        rgba(255,255,255,.16);

    transform:skewX(-10deg);
}


/* ribbon vertical */

.ribbon-v{

    position:absolute;

    left:50%;

    transform:
        translateX(-50%);

    width:27px;
    height:100%;

    background:
        rgba(255,255,255,.42);

    z-index:3;
}


/* ribbon horizontal */

.ribbon-h{

    position:absolute;

    left:0;
    top:48px;

    width:100%;
    height:27px;

    background:
        rgba(255,255,255,.35);

    z-index:3;
}


/* =========================================================
   GIFT LID
========================================================= */

.gift-lid{

    position:absolute;

    z-index:8;

    width:210px;
    height:43px;

    left:-10px;
    top:-10px;

    border-radius:
        12px
        12px
        8px
        8px;

    background:
        linear-gradient(
            135deg,
            #f5abc9,
            #cfafe8
        );

    transform-origin:
        15px 40px;

    transition:
        transform
        .9s
        cubic-bezier(.2,.8,.2,1);

    box-shadow:
        0 8px 14px
        rgba(150,120,160,.12);
}


/* lid ribbon */

.gift-lid::after{

    content:"";

    position:absolute;

    left:50%;

    transform:
        translateX(-50%);

    width:27px;
    height:100%;

    background:
        rgba(255,255,255,.42);
}


/* opened */

.gift.open .gift-lid{

    transform:
        rotate(-28deg)
        translate(
            -25px,
            -48px
        );
}


/* =========================================================
   BOW
========================================================= */

.bow{

    position:absolute;

    z-index:10;

    top:-38px;

    left:50%;

    transform:
        translateX(-50%);
}


.bow-left,
.bow-right{

    position:absolute;

    width:52px;
    height:37px;

    background:
        linear-gradient(
            135deg,
            #f4aac9,
            #cba9e6
        );

    border-radius:
        50%
        50%
        20%
        50%;
}


.bow-left{

    right:2px;

    transform:
        rotate(25deg);
}


.bow-right{

    left:2px;

    transform:
        scaleX(-1)
        rotate(25deg);
}


.bow-center{

    position:absolute;

    width:24px;
    height:24px;

    left:50%;
    top:7px;

    transform:
        translateX(-50%);

    border-radius:50%;

    background:#eea6c6;

    box-shadow:
        0 4px 10px
        rgba(150,100,150,.15);
}


/* =========================================================
   SURPRISE ITEMS
========================================================= */

.surprise-item{

    position:absolute;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%)
        scale(.2);

    opacity:0;

    font-size:30px;

    transition:
        all .8s
        cubic-bezier(.2,.8,.2,1);
}


.gift.open .item1{

    opacity:1;

    transform:
        translate(
            -150px,
            -115px
        )
        rotate(-20deg)
        scale(1);
}

.gift.open .item2{

    opacity:1;

    transform:
        translate(
            105px,
            -125px
        )
        rotate(20deg)
        scale(1);
}

.gift.open .item3{

    opacity:1;

    transform:
        translate(
            -20px,
            -155px
        )
        scale(1.1);
}

.gift.open .item4{

    opacity:1;

    transform:
        translate(
            105px,
            -25px
        )
        scale(.9);
}


/* =========================================================
   BUTTON
========================================================= */

.action-btn{

    border:none;

    min-width:220px;

    padding:
        14px
        25px;

    border-radius:50px;

    color:white;

    font-family:inherit;

    font-size:15px;

    font-weight:600;

    cursor:pointer;

    background:
        linear-gradient(
            135deg,
            #f1abc9,
            #bba8e7,
            #9ed7ee
        );

    box-shadow:
        0 12px 28px
        rgba(180,145,200,.25);

    transition:
        .25s ease;
}


.action-btn:hover{

    transform:
        translateY(-3px);

    box-shadow:
        0 17px 35px
        rgba(180,145,200,.32);
}


.action-btn:active{

    transform:
        scale(.97);
}


/* =========================================================
   BOTTOM TEXT
========================================================= */

.bottom-text{

    margin-top:15px;

    font-size:12px;

    color:#aaa1ad;
}


/* =========================================================
   FULLSCREEN TRANSITION
========================================================= */

.transition{

    position:fixed;

    inset:0;

    z-index:500;

    background:
        linear-gradient(
            135deg,
            #fff3fa,
            #f1f8ff,
            #f5edff
        );

    display:flex;

    align-items:center;

    justify-content:center;

    opacity:0;

    pointer-events:none;

    transition:
        opacity .6s ease;
}


.transition.show{

    opacity:1;

    pointer-events:auto;
}


.transition-heart{

    font-size:70px;

    animation:
        transitionHeart
        1s
        ease-in-out
        infinite;
}


@keyframes transitionHeart{

    0%,
    100%{
        transform:scale(.9);
    }

    50%{
        transform:scale(1.2);
    }
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

    .card{

        padding:
            30px
            15px
            27px;

        border-radius:32px;
    }


    .gift-stage{

        width:280px;
        height:250px;
    }


    .gift{

        transform:
            scale(.88);
    }


    .gift:hover{

        transform:
            scale(.92)
            translateY(-5px);
    }


    .description{

        font-size:13px;
    }


    .flower{

        font-size:30px;
    }

}

</style>

</head>


<body>


<!-- =======================================================
     BACKGROUND
======================================================= -->

<div class="background">


    <div class="blob one"></div>
    <div class="blob two"></div>
    <div class="blob three"></div>


    <div class="star s1">✦</div>
    <div class="star s2">✧</div>
    <div class="star s3">✦</div>
    <div class="star s4">✧</div>
    <div class="star s5">✦</div>
    <div class="star s6">✧</div>


    

    <div class="heart h1">♡</div>
    <div class="heart h2">♥</div>
    <div class="heart h3">♡</div>
    <div class="heart h4">♥</div>

</div>



<!-- =======================================================
     MAIN
======================================================= -->

<main class="main">


    <section class="card">


        <div class="small-title">
            
        </div>


        <h1>
            ของ<span>ที่รักก</span>
        </h1>


        <p class="description">

            เซอร์ไพรส์นี้อาจจะไม่ได้เซอร์ไพรส์อะไรมาก
            แต่ตั้งใจทำขึ้นมาก เพื่อสร้างความทรงจำดีๆให้หนูนะคะ
            

        </p>



        <!-- =================================================
             GIFT
        ================================================= -->

        <div class="gift-stage">


            <div class="gift-glow"></div>


            <div
                class="gift"
                id="gift"
                onclick="openGift()"
            >


                <!-- surprise items -->

                <div class="surprise-item item1">
                    
                </div>

                <div class="surprise-item item2">
                    ⭐
                </div>

                <div class="surprise-item item3">
                    
                </div>

                <div class="surprise-item item4">
                    
                </div>


                <!-- box -->

                <div class="gift-box">

                    <div class="ribbon-v"></div>

                    <div class="ribbon-h"></div>

                </div>


                <!-- lid -->

                <div class="gift-lid"></div>


                <!-- bow -->

                <div class="bow">

                    <div class="bow-left"></div>

                    <div class="bow-right"></div>

                    <div class="bow-center"></div>

                </div>


            </div>

        </div>



        <!-- BUTTON -->

        <button
            class="action-btn"
            id="actionBtn"
            onclick="handleButton()"
        >

            เปิดเลยอ้วนนน

        </button>


        <div class="bottom-text">

            

        </div>


    </section>

</main>



<!-- =======================================================
     TRANSITION
======================================================= -->

<div
    class="transition"
    id="transition"
>

    <div class="transition-heart">
        🧸
    </div>

</div>



<script>

/* =========================================================
   VARIABLES
========================================================= */

let opened = false;


/* =========================================================
   OPEN GIFT
========================================================= */

function openGift(){

    if(opened){
        return;
    }


    opened = true;


    const gift =
        document.getElementById(
            "gift"
        );


    const button =
        document.getElementById(
            "actionBtn"
        );


    gift.classList.add("open");


    button.innerHTML =
        "กดปุ่มเลยมีอีกกก 💗";


    document.querySelector(
        ".bottom-text"
    ).textContent =
        


    createParticles();

}


/* =========================================================
   BUTTON
========================================================= */

function handleButton(){

    if(!opened){

        openGift();

        return;

    }


    goNext();

}


/* =========================================================
   NEXT PAGE
========================================================= */

function goNext(){

    const transition =
        document.getElementById(
            "transition"
        );


    transition.classList.add(
        "show"
    );


    createParticles();


    setTimeout(() => {

        window.location.href =
            "birthday.html";

    },900);

}


/* =========================================================
   PARTICLES
========================================================= */

function createParticles(){

    const icons = [
        "💗",
        "♡",
        "⭐",
        "✨",
        "🌷",
        "🧸"
    ];


    for(let i = 0; i < 28; i++){

        setTimeout(() => {

            const particle =
                document.createElement(
                    "div"
                );


            particle.style.position =
                "fixed";

            particle.style.left =
                "50%";

            particle.style.top =
                "48%";

            particle.style.zIndex =
                "300";

            particle.style.pointerEvents =
                "none";

            particle.style.fontSize =
                (
                    18 +
                    Math.random() * 16
                ) + "px";


            particle.textContent =
                icons[
                    Math.floor(
                        Math.random()
                        * icons.length
                    )
                ];


            const x =
                Math.random() * 500
                - 250;

            const y =
                Math.random() * 400
                - 250;


            particle.animate(

                [

                    {
                        transform:
                            "translate(-50%,-50%) scale(.3)",
                        opacity:1
                    },

                    {
                        transform:
                            `translate(
                                calc(-50% + ${x}px),
                                calc(-50% + ${y}px)
                            )
                            rotate(${Math.random()*360}deg)
                            scale(1.3)`,

                        opacity:0
                    }

                ],

                {

                    duration:
                        900 +
                        Math.random() * 500,

                    easing:
                        "cubic-bezier(.2,.8,.2,1)",

                    fill:"forwards"

                }

            );


            document.body.appendChild(
                particle
            );


            setTimeout(() => {

                particle.remove();

            },1500);

        }, i * 35);

    }

}

</script>
<script src="music.js"></script>
</body>

</html>
