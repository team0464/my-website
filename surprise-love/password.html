<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>รหัสของเรา </title>


<style>

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


html,
body{
    width:100%;
    min-height:100%;
}


body{

    font-family:
        "Segoe UI",
        "Noto Sans Thai",
        sans-serif;

    color:#71677c;

    overflow:hidden;

    background:
        linear-gradient(
            135deg,
            #fff5fa 0%,
            #f2f8ff 48%,
            #f6efff 100%
        );
}


/* =========================================================
   BACKGROUND
========================================================= */

.background{

    position:fixed;

    inset:0;

    overflow:hidden;

    pointer-events:none;
}


/* =========================================================
   PASTEL BLOBS
========================================================= */

.blob{

    position:absolute;

    border-radius:50%;

    filter:blur(15px);

    opacity:.5;
}


.blob.one{

    width:360px;
    height:360px;

    background:#ffd3e6;

    top:-140px;
    left:-120px;
}


.blob.two{

    width:320px;
    height:320px;

    background:#ccecff;

    right:-120px;
    top:20%;
}


.blob.three{

    width:400px;
    height:400px;

    background:#dfd0ff;

    left:25%;
    bottom:-250px;
}


/* =========================================================
   STARS
========================================================= */

.star{

    position:absolute;

    color:white;

    font-size:18px;

    animation:
        twinkle 3s ease-in-out infinite;
}


.star:nth-child(1){
    top:10%;
    left:15%;
    animation-delay:.2s;
}


.star:nth-child(2){
    top:17%;
    right:20%;
    animation-delay:1s;
}


.star:nth-child(3){
    top:42%;
    left:7%;
    animation-delay:1.8s;
}


.star:nth-child(4){
    top:70%;
    right:9%;
    animation-delay:.7s;
}


.star:nth-child(5){
    bottom:13%;
    left:20%;
    animation-delay:2.2s;
}


.star:nth-child(6){
    top:30%;
    right:35%;
    animation-delay:1.3s;
}


@keyframes twinkle{

    0%,
    100%{
        opacity:.25;
        transform:scale(.7);
    }

    50%{
        opacity:1;
        transform:scale(1.35);
    }

}


/* =========================================================
   FLOWERS
========================================================= */

.flower{

    position:absolute;

    font-size:38px;

    animation:
        flowerFloat 5s ease-in-out infinite;
}


.flower.one{

    top:7%;
    left:6%;

    transform:rotate(-15deg);
}


.flower.two{

    top:8%;
    right:6%;

    transform:rotate(15deg);

    animation-delay:1s;
}


.flower.three{

    bottom:7%;
    left:7%;

    transform:rotate(-10deg);

    animation-delay:2s;
}


.flower.four{

    bottom:8%;
    right:7%;

    transform:rotate(10deg);

    animation-delay:1.5s;
}


@keyframes flowerFloat{

    0%,
    100%{
        transform:
            translateY(0)
            rotate(-8deg);
    }

    50%{
        transform:
            translateY(-10px)
            rotate(5deg);
    }

}


/* =========================================================
   FLOATING HEARTS
========================================================= */

.heart{

    position:absolute;

    color:#f2a9c8;

    opacity:.65;

    animation:
        heartFloat 5s ease-in-out infinite;
}


.heart.one{

    top:25%;
    left:18%;

    font-size:20px;
}


.heart.two{

    top:55%;
    right:18%;

    font-size:26px;

    animation-delay:1s;
}


.heart.three{

    bottom:20%;
    left:28%;

    font-size:17px;

    animation-delay:2s;
}


.heart.four{

    top:22%;
    right:30%;

    font-size:15px;

    animation-delay:.5s;
}


@keyframes heartFloat{

    0%,
    100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-14px);
    }

}


/* =========================================================
   MAIN
========================================================= */

.main{

    position:relative;

    z-index:5;

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:20px;
}


/* =========================================================
   CARD
========================================================= */

.card{

    width:min(460px,100%);

    padding:40px 30px 35px;

    text-align:center;

    background:
        rgba(255,255,255,.76);

    border:
        1px solid
        rgba(255,255,255,.9);

    border-radius:38px;

    box-shadow:
        0 25px 70px
        rgba(160,135,180,.16),

        inset 0 1px 0
        rgba(255,255,255,.9);

    backdrop-filter:blur(20px);

    animation:
        cardAppear .9s ease;
}


@keyframes cardAppear{

    from{

        opacity:0;

        transform:
            translateY(30px)
            scale(.95);
    }

    to{

        opacity:1;

        transform:
            translateY(0)
            scale(1);
    }

}


/* =========================================================
   LOCK AREA
========================================================= */

.lock-area{

    width:110px;
    height:110px;

    margin:0 auto 20px;

    position:relative;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:
        linear-gradient(
            145deg,
            #fff1f8,
            #edf8ff
        );

    box-shadow:
        0 15px 35px
        rgba(180,150,190,.18);

    animation:
        lockFloat 3s ease-in-out infinite;
}


.lock{

    font-size:60px;

    filter:
        drop-shadow(
            0 5px 8px
            rgba(150,120,160,.15)
        );
}


.lock-heart{

    position:absolute;

    right:-3px;
    bottom:0;

    font-size:28px;

    animation:
        heartbeat 1.5s ease-in-out infinite;
}


@keyframes lockFloat{

    0%,
    100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-7px);
    }

}


@keyframes heartbeat{

    0%,
    100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.2);
    }

}


/* =========================================================
   ROTATING RING
========================================================= */

.ring{

    position:absolute;

    inset:-13px;

    border-radius:50%;

    border:
        2px dashed
        rgba(225,175,215,.45);

    animation:
        rotate 12s linear infinite;
}


.ring::before,
.ring::after{

    content:"";

    position:absolute;

    font-size:18px;
}


.ring::before{

    content:"💗";

    top:-10px;
    left:50%;

    transform:translateX(-50%);
}



@keyframes rotate{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }

}


/* =========================================================
   TEXT
========================================================= */

.small-title{

    font-size:12px;

    letter-spacing:4px;

    color:#b18cc3;

    margin-bottom:10px;

    font-weight:600;
}


h1{

    font-size:clamp(28px,7vw,40px);

    color:#76697f;

    margin-bottom:9px;

    line-height:1.2;
}


h1 span{

    color:#e49fbe;
}


.subtitle{

    font-size:14px;

    line-height:1.8;

    color:#958b9b;

    max-width:340px;

    margin:
        0 auto 24px;
}


/* =========================================================
   PASSWORD BOX
========================================================= */

.password-box{

    position:relative;

    margin:
        0 auto 15px;

    max-width:330px;
}


.password-input{

    width:100%;

    height:56px;

    border:none;

    outline:none;

    border-radius:20px;

    text-align:center;

    font-family:inherit;

    font-size:21px;

    letter-spacing:8px;

    color:#806f87;

    background:
        linear-gradient(
            135deg,
            #fff7fb,
            #f4f9ff
        );

    box-shadow:
        inset 0 0 0 1px
        rgba(220,190,220,.35),

        0 8px 25px
        rgba(170,145,180,.08);

    transition:
        .25s ease;
}


.password-input::placeholder{

    color:#c5bac9;

    letter-spacing:2px;

    font-size:13px;
}


.password-input:focus{

    box-shadow:

        0 0 0 4px
        rgba(238,185,215,.15),

        inset 0 0 0 1px
        rgba(215,170,210,.5);
}


/* =========================================================
   BUTTON
========================================================= */

.unlock-btn{

    width:100%;

    max-width:330px;

    height:54px;

    border:none;

    border-radius:50px;

    cursor:pointer;

    color:white;

    font-family:inherit;

    font-size:15px;

    font-weight:600;

    background:
        linear-gradient(
            135deg,
            #f1abc9,
            #bda9e8,
            #9ed7ee
        );

    box-shadow:
        0 12px 28px
        rgba(185,150,205,.25);

    transition:
        transform .2s ease,
        box-shadow .2s ease;
}


.unlock-btn:hover{

    transform:
        translateY(-3px);

    box-shadow:
        0 17px 35px
        rgba(180,145,205,.32);
}


.unlock-btn:active{

    transform:
        scale(.97);
}


/* =========================================================
   HINT
========================================================= */

.hint{

    margin-top:18px;

    font-size:12px;

    color:#aaa1ae;
}


/* =========================================================
   WRONG SHAKE
========================================================= */

.shake{

    animation:
        shake .45s ease;
}


@keyframes shake{

    0%,
    100%{
        transform:translateX(0);
    }

    20%{
        transform:translateX(-10px);
    }

    40%{
        transform:translateX(10px);
    }

    60%{
        transform:translateX(-7px);
    }

    80%{
        transform:translateX(7px);
    }

}


/* =========================================================
   POPUP
========================================================= */

.popup{

    position:fixed;

    inset:0;

    z-index:100;

    display:none;

    align-items:center;

    justify-content:center;

    padding:20px;

    background:
        rgba(255,245,251,.55);

    backdrop-filter:blur(8px);
}


.popup.show{

    display:flex;

    animation:
        popupFade .3s ease;
}


@keyframes popupFade{

    from{
        opacity:0;
    }

    to{
        opacity:1;
    }

}


.popup-card{

    width:min(360px,100%);

    padding:32px 25px;

    text-align:center;

    border-radius:30px;

    background:
        rgba(255,255,255,.92);

    box-shadow:
        0 25px 70px
        rgba(150,120,170,.2);

    animation:
        popupCard .35s ease;
}


@keyframes popupCard{

    from{

        transform:
            scale(.8)
            translateY(20px);

        opacity:0;
    }

    to{

        transform:
            scale(1)
            translateY(0);

        opacity:1;
    }

}


.popup-icon{

    font-size:52px;

    margin-bottom:12px;
}


.popup-card h2{

    color:#7c6b83;

    margin-bottom:8px;
}


.popup-card p{

    color:#978c9d;

    font-size:14px;

    line-height:1.7;

    margin-bottom:20px;
}


.popup-btn{

    border:none;

    padding:11px 25px;

    border-radius:50px;

    color:white;

    background:
        linear-gradient(
            135deg,
            #efa9c8,
            #b9a6e5
        );

    font-family:inherit;

    cursor:pointer;
}


/* =========================================================
   SUCCESS PARTICLES
========================================================= */

.particle{

    position:fixed;

    z-index:200;

    pointer-events:none;

    font-size:22px;

    animation:
        particleFly 1.1s ease forwards;
}


@keyframes particleFly{

    0%{

        opacity:1;

        transform:
            translate(-50%,-50%)
            scale(.5);
    }

    100%{

        opacity:0;

        transform:
            translate(
                calc(-50% + var(--x)),
                calc(-50% + var(--y))
            )
            rotate(180deg)
            scale(1.4);
    }

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

    .main{
        padding:15px;
    }


    .card{

        padding:
            32px
            20px
            28px;

        border-radius:30px;
    }


    .lock-area{

        width:95px;
        height:95px;
    }


    .lock{
        font-size:52px;
    }


    .flower{
        font-size:30px;
    }


    .flower.one{
        left:2%;
    }


    .flower.two{
        right:2%;
    }


    .flower.three{
        left:2%;
    }


    .flower.four{
        right:2%;
    }


    .subtitle{
        font-size:13px;
    }

}

</style>

</head>


<body>


<!-- =======================================================
     BACKGROUND
======================================================= -->

<div class="background">


    <!-- blobs -->

    <div class="blob one"></div>

    <div class="blob two"></div>

    <div class="blob three"></div>


    <!-- stars -->

    <div class="star">✦</div>
    <div class="star">✧</div>
    <div class="star">✦</div>
    <div class="star">✧</div>
    <div class="star">✦</div>
    <div class="star">✧</div>


    <!-- flowers -->

    

    <!-- hearts -->

    <div class="heart one">
        ♡
    </div>

    <div class="heart two">
        ♥
    </div>

    <div class="heart three">
        ♡
    </div>

    <div class="heart four">
        ♥
    </div>

</div>



<!-- =======================================================
     MAIN
======================================================= -->

<main class="main">


    <section
        class="card"
        id="mainCard"
    >


        <!-- LOCK -->

        <div class="lock-area">

            <div class="ring"></div>

            <div class="lock">
                🔐
            </div>

            
        </div>


        <!-- TITLE -->

        <div class="small-title">
            
        </div>


        <h1>
            รหัส<span>อะไรน้าา</span>
        </h1>


        <p class="subtitle">

            นึกดีๆก่อนนะจ๊ะใบ้ให้ว่ามีปีที่เราคบกัน
            💗

        </p>


        <!-- PASSWORD -->

        <div class="password-box">

            <input
                id="passwordInput"
                class="password-input"
                type="password"
                inputmode="numeric"
                maxlength="10"
                placeholder="รหัสมี6ตัววว"
                autocomplete="off"
            >

        </div>


        <!-- BUTTON -->

        <button
            class="unlock-btn"
            onclick="checkPassword()"
        >

            ไปกันต่ออ 

        </button>


        <div class="hint">

             

        </div>


    </section>

</main>



<!-- =======================================================
     POPUP
======================================================= -->

<div
    class="popup"
    id="popup"
    onclick="closePopup(event)"
>


    <div
        class="popup-card"
        onclick="event.stopPropagation()"
    >

        <div
            class="popup-icon"
            id="popupIcon"
        >
            💗
        </div>


        <h2 id="popupTitle">
            ถูกต้องแล้ว!
        </h2>


        <p id="popupText">
            เตรียมพบกับเรื่องราวต่อไปได้เลย ✨
        </p>


        <button
            class="popup-btn"
            onclick="closePopup()"
        >

            ย้อนกลับ

        </button>

    </div>

</div>



<script>

/* =========================================================
   PASSWORD
========================================================= */

const correctPassword = "101067";


/* =========================================================
   CHECK PASSWORD
========================================================= */

function checkPassword(){

    const input =
        document.getElementById(
            "passwordInput"
        );

    const card =
        document.getElementById(
            "mainCard"
        );

    const password =
        input.value.trim();


    /* empty */

    if(password === ""){

        showPopup(
            "🔐",
            "ลืมใส่รหัสรึป่าวว!!!",
            "ลองใส่รหัสลับของเราก่อนนะอ้วน 💗"
        );

        return;
    }


    /* correct */

    if(password === correctPassword){

        createParticles();

        showPopup(
            "🎉",
            "ถูกต้องแล้ว!",
            "เก่งมากกก 💗 เตรียมไปเปิดเซอร์ไพรส์ต่อได้เลย ✨"
        );


        input.blur();


        setTimeout(() => {

            window.location.href =
                "surprise.html";

        }, 1500);

    }


    /* wrong */

    else{

        card.classList.remove("shake");

        void card.offsetWidth;

        card.classList.add("shake");


        input.value = "";

        input.focus();


        showPopup(
            "🥺",
            "ยังไม่ถูกนะงับ",
            "ลองนึกดีๆสิอ้วน"
        );

    }

}


/* =========================================================
   POPUP
========================================================= */

function showPopup(
    icon,
    title,
    text
){

    document.getElementById(
        "popupIcon"
    ).textContent = icon;


    document.getElementById(
        "popupTitle"
    ).textContent = title;


    document.getElementById(
        "popupText"
    ).textContent = text;


    document.getElementById(
        "popup"
    ).classList.add("show");

}


/* =========================================================
   CLOSE POPUP
========================================================= */

function closePopup(){

    document.getElementById(
        "popup"
    ).classList.remove("show");

}


/* =========================================================
   PARTICLES
========================================================= */

function createParticles(){

    const icons = [
        "💗",
        "♡",
        "✨",
        "🌷",
        "⭐",
        "🧸"
    ];


    for(let i = 0; i < 25; i++){

        setTimeout(() => {

            const particle =
                document.createElement("div");


            particle.className =
                "particle";


            particle.textContent =
                icons[
                    Math.floor(
                        Math.random()
                        * icons.length
                    )
                ];


            particle.style.left =
                "50%";


            particle.style.top =
                "50%";


            particle.style.setProperty(
                "--x",
                (
                    Math.random() * 500
                    - 250
                ) + "px"
            );


            particle.style.setProperty(
                "--y",
                (
                    Math.random() * 500
                    - 250
                ) + "px"
            );


            document.body.appendChild(
                particle
            );


            setTimeout(() => {

                particle.remove();

            },1200);

        }, i * 35);

    }

}


/* =========================================================
   ENTER KEY
========================================================= */

document
    .getElementById("passwordInput")
    .addEventListener(
        "keydown",
        function(event){

            if(event.key === "Enter"){

                checkPassword();

            }

        }
    );


/* =========================================================
   CLOSE POPUP BY ESC
========================================================= */

document.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Escape"){

            closePopup();

        }

    }
);

</script>

<script src="music.js"></script>
</body>
</html>
